<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda3DS Web</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { width: 400px; height: 480px; image-rendering: pixelated; background: #000; }
  #log { width: min(640px, 100%); height: 160px; overflow: auto; background: #000; font: 12px ui-monospace, monospace; white-space: pre-wrap; padding: 6px; box-sizing: border-box; }
</style>
</head>
<body>
<div>
  <input type="file" id="file" accept=".3dsx,.elf,.axf,.3ds,.cci,.cxi,.app,.ncch">
  <span id="status">loading…</span>
</div>
<canvas id="canvas" width="400" height="480" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="log"></div>
<script>
  // Keep the last presented frame readable so screenshots and toDataURL see it
  const getContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    return getContext.call(this, type, type.startsWith('webgl') ? { ...attrs, preserveDrawingBuffer: true } : attrs);
  };
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const log = (s) => { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log(s); };

  async function bootRom(name, bytes) {
    const path = '/roms/' + name;
    try { Module.FS.mkdir('/roms'); } catch {}
    Module.FS.writeFile(path, bytes);
    const ok = Module.ccall('panda_load_rom', 'number', ['string'], [path]);
    statusEl.textContent = ok ? 'running ' + name : 'failed to load ' + name;
    document.getElementById('canvas').focus();
    return ok;
  }

  var Module = {
    canvas: document.getElementById('canvas'),
    print: log,
    printErr: log,
    onPandaReady: async () => {
      statusEl.textContent = 'ready';
      const rom = new URLSearchParams(location.search).get('rom');
      if (rom) {
        const res = await fetch(rom);
        await bootRom(rom.split('/').pop(), new Uint8Array(await res.arrayBuffer()));
      }
      window.pandaReady = true;
    },
  };

  document.getElementById('file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) await bootRom(f.name, new Uint8Array(await f.arrayBuffer()));
  });
</script>
<script src="AlberWeb.js"></script>
</body>
</html>
