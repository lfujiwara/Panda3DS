<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda3DS Web</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { width: 400px; height: 480px; image-rendering: pixelated; background: #000; }
  .keys { font-size: 12px; color: #aaa; text-align: center; max-width: 640px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid #555; border-radius: 3px; padding: 0 3px; }
  #log { width: min(640px, 100%); height: 160px; overflow: auto; background: #000; font: 12px ui-monospace, monospace; white-space: pre-wrap; padding: 6px; box-sizing: border-box; }
</style>
</head>
<body>
<div>
  <input type="file" id="file" accept=".3dsx,.elf,.axf,.3ds,.cci,.cxi,.app,.ncch">
  <span id="status">loading…</span>
</div>
<div class="keys">A <kbd>L</kbd> · B <kbd>K</kbd> · X <kbd>O</kbd> · Y <kbd>I</kbd> · L/R <kbd>Q</kbd>/<kbd>P</kbd> · Start <kbd>Enter</kbd> · Select <kbd>Backspace</kbd> · D-pad arrows · Circle pad <kbd>WASD</kbd> · touch = click the bottom screen</div>
<canvas id="canvas" width="400" height="480" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="log"></div>
<script>
  // Keep the last presented frame readable so screenshots and toDataURL see it
  const getContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    return getContext.call(this, type, type.startsWith('webgl') ? { ...attrs, preserveDrawingBuffer: true } : attrs);
  };
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const log = (s) => { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log(s); };

  async function bootRom(name, bytes) {
    const path = '/roms/' + name;
    try { Module.FS.mkdir('/roms'); } catch {}
    Module.FS.writeFile(path, bytes);
    const ok = Module.ccall('panda_load_rom', 'number', ['string'], [path]);
    statusEl.textContent = ok ? 'running ' + name : 'failed to load ' + name;
    document.getElementById('canvas').focus();
    return ok;
  }

  var Module = {
    canvas: document.getElementById('canvas'),
    print: log,
    printErr: log,
    // ?env=KEY=VAL,KEY2=VAL2 sets getenv() values for debugging toggles
    preRun: [() => {
      // Panda keeps config, saves and the emulated SD card under SDL's pref path (/libsdl/Alber); persist it in IndexedDB
      Module.FS.mkdir('/libsdl');
      Module.FS.mount(Module.IDBFS, {}, '/libsdl');
      Module.addRunDependency('idbfs');
      Module.FS.syncfs(true, (err) => {
        if (err) log('[web] IDBFS load failed: ' + err);
        Module.removeRunDependency('idbfs');
      });
      for (const kv of (new URLSearchParams(location.search).get('env') || '').split(',').filter(Boolean)) {
        const [k, v = '1'] = kv.split('=');
        Module.ENV[k] = v;
      }
    }],
    onPandaReady: async () => {
      statusEl.textContent = 'ready';
      const rom = new URLSearchParams(location.search).get('rom');
      if (rom) {
        // ?sd=<url>=<path on SD card>,... copies files onto this ROM's emulated SD card (it lives at <app data>/<rom stem>/SDMC)
        const stem = rom.split('/').pop().replace(/\.[^.]*$/, '');
        for (const entry of (new URLSearchParams(location.search).get('sd') || '').split(',').filter(Boolean)) {
          const [url, sdPath] = entry.split('=');
          const dest = `/libsdl/Alber/${stem}/SDMC/${sdPath.replace(/^\/+/, '')}`;
          let dir = '';
          for (const part of dest.split('/').slice(1, -1)) { dir += '/' + part; try { Module.FS.mkdir(dir); } catch {} }
          Module.FS.writeFile(dest, new Uint8Array(await (await fetch(url)).arrayBuffer()));
          log('[web] sd: ' + dest);
        }
        const res = await fetch(rom);
        await bootRom(rom.split('/').pop(), new Uint8Array(await res.arrayBuffer()));
      }
      window.pandaReady = true;
    },
  };

  let syncing = false;
  window.pandaSync = () => new Promise((resolve) => {
    if (syncing || !Module.FS) return resolve(false);
    syncing = true;
    Module.FS.syncfs(false, (err) => { syncing = false; if (err) log('[web] IDBFS save failed: ' + err); resolve(!err); });
  });
  setInterval(window.pandaSync, 5000);
  addEventListener('pagehide', window.pandaSync);
  document.addEventListener('visibilitychange', () => document.hidden && window.pandaSync());

  // Browsers only start audio after a user gesture
  const resumeAudio = () => {
    for (const ctx of window.pandaAudioContexts || []) if (ctx.state !== 'running') ctx.resume();
  };
  addEventListener('pointerdown', resumeAudio);
  addEventListener('keydown', resumeAudio);
  for (const C of [window.AudioContext, window.webkitAudioContext].filter(Boolean)) {
    const orig = C.prototype.createScriptProcessor;
    if (!orig) continue;
    C.prototype.createScriptProcessor = function (...args) {
      (window.pandaAudioContexts ||= new Set()).add(this);
      return orig.apply(this, args);
    };
  }

  document.getElementById('file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) await bootRom(f.name, new Uint8Array(await f.arrayBuffer()));
  });
</script>
<script src="AlberWeb.js"></script>
</body>
</html>
